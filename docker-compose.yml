services:
  db:
    image: postgres:17-alpine
    container_name: coffee-db
    environment:
      POSTGRES_USER: ${DB_USER:-coffee}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-coffee}
      POSTGRES_DB: ${DB_NAME:-coffee_shop}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - coffee-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coffee} -d ${DB_NAME:-coffee_shop}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - coffee-shop

  backend:
    build:
      context: .
    container_name: coffee-backend
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-coffee}
      DB_PASSWORD: ${DB_PASSWORD:-coffee}
      DB_NAME: ${DB_NAME:-coffee_shop}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5173}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - coffee-shop

networks:
  coffee-shop:
    name: coffee-shop

volumes:
  coffee-db-data:
